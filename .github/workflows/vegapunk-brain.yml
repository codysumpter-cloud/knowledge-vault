name: Vegapunk Brain

on:
  push:
    paths:
      - '99-System/Vegapunk Brain/**'
      - '.github/workflows/vegapunk-brain.yml'
  pull_request:
    paths:
      - '99-System/Vegapunk Brain/**'
      - '.github/workflows/vegapunk-brain.yml'

jobs:
  validate:
    name: Validate Punk Records
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Check tool syntax
        run: python "99-System/Vegapunk Brain/tools/graph_doctor.py"

      - name: Validate seed graph
        run: python "99-System/Vegapunk Brain/tools/graph_linter.py" "99-System/Vegapunk Brain/graph/seed.graph.jsonl"

      - name: Validate event ingestion
        run: bash "99-System/Vegapunk Brain/scripts/validate-vegapunk-brain.sh"

      - name: Rebuild graph from events
        run: bash "99-System/Vegapunk Brain/scripts/rebuild-vegapunk-brain.sh"

      - name: Search rebuilt graph
        run: python "99-System/Vegapunk Brain/tools/graph_search.py" --graph "99-System/Vegapunk Brain/outbox/graph-records/compiled.graph.jsonl" --query "Knowledge Vault"

      - name: Run full pipeline
        run: bash "99-System/Vegapunk Brain/scripts/run-vegapunk-brain.sh"
