name: Vault Steward Daily Maintenance

on:
  schedule:
    - cron: "30 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  maintain-vault:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout vault
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run Vault Steward
        env:
          VAULT_GITHUB_OWNER: codysumpter-cloud
          VAULT_GITHUB_TOKEN: ${{ secrets.VAULT_MAINTAINER_TOKEN || github.token }}
          VAULT_TRACK_PRIVATE: "false"
        run: python3 "99-System/Automation/vault_maintainer.py"

      - name: Generate dashboards
        run: python3 "99-System/Automation/generate_vault_dashboards.py"

      - name: Run Vault Doctor
        run: python3 "99-System/Automation/vault_doctor.py"

      - name: Commit safe vault updates
        run: |
          git config user.name "vault-steward[bot]"
          git config user.email "vault-steward[bot]@users.noreply.github.com"
          git add \
            AGENTS.md \
            README.md \
            SYSTEMMAP.md \
            RUNBOOK.md \
            BACKLOG.md \
            SECURITY.md \
            .github/workflows \
            "01-Dashboard" \
            "30 - Projects/GitHub" \
            "99-System/Agents" \
            "99-System/Automation" \
            "99-System/Agent Skills" \
            "99-System/Repositories" \
            .gitignore
          if git diff --cached --quiet; then
            echo "No vault changes to commit."
          else
            git commit -m "vault: daily steward maintenance"
            git push
          fi
