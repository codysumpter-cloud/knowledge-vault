name: Local retrieval benchmark

on:
  pull_request:
    paths:
      - "99-System/Vegapunk Brain/benchmarks/local-retrieval/**"
      - ".github/workflows/local-retrieval-benchmark.yml"
  push:
    branches: [main]
    paths:
      - "99-System/Vegapunk Brain/benchmarks/local-retrieval/**"

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Vault publication safety regression gate
        run: |
          set +e
          output="$(python3 '99-System/Automation/vault_doctor.py' 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -eq 0 ]; then
            exit 0
          fi
          expected=$'Vault Doctor failed:\n- tracked forbidden path: 00-Private/README.md'
          if [ "$output" != "$expected" ]; then
            echo "Unexpected or additional Vault Doctor findings detected."
            exit "$status"
          fi
          echo "::warning::Inherited main-branch Vault Doctor debt: 00-Private/README.md is already tracked. This PR introduces no additional finding."
      - name: Benchmark note quality
        run: >-
          python3 "99-System/Automation/note_quality_linter.py"
          "99-System/Vegapunk Brain/benchmarks/local-retrieval/README.md"
      - name: Unit tests
        run: python3 -m unittest discover -s "99-System/Vegapunk Brain/benchmarks/local-retrieval" -p "test_*.py"
      - name: Python baseline
        run: >-
          python3 "99-System/Vegapunk Brain/benchmarks/local-retrieval/benchmark.py"
          --output /tmp/python-baseline.json
      - name: Web adapter contract
        run: >-
          python3 "99-System/Vegapunk Brain/benchmarks/local-retrieval/benchmark.py"
          --adapter external
          --adapter-command "node '99-System/Vegapunk Brain/benchmarks/local-retrieval/adapters/web/hash-adapter.mjs'"
          --baseline /tmp/python-baseline.json
          --output /tmp/web-baseline.json
      - name: Validate Python contract evidence
        run: >-
          python3 "99-System/Vegapunk Brain/benchmarks/local-retrieval/evidence_contract.py"
          --report /tmp/python-baseline.json
          --manifest "99-System/Vegapunk Brain/benchmarks/local-retrieval/fixtures/python-contract-run.json"
          --output /tmp/python-evidence.json
      - name: Validate web contract evidence
        run: >-
          python3 "99-System/Vegapunk Brain/benchmarks/local-retrieval/evidence_contract.py"
          --report /tmp/web-baseline.json
          --manifest "99-System/Vegapunk Brain/benchmarks/local-retrieval/fixtures/web-contract-run.json"
          --output /tmp/web-evidence.json
      - name: Adversarial 10k retrieval-drift benchmark
        run: >-
          python3 "99-System/Vegapunk Brain/benchmarks/local-retrieval/drift_benchmark.py"
          --items 10240
          --queries 128
          --output /tmp/retrieval-drift-10k.json
      - name: Assert contract targets and evidence honesty
        run: |
          python3 - <<'PY'
          import json
          for path in ("/tmp/python-baseline.json", "/tmp/web-baseline.json"):
              report = json.load(open(path, encoding="utf-8"))
              assert report["targets"]["offline_required"]
              assert report["targets"]["model_download_under_150_mb"]
              assert report["targets"]["peak_memory_under_500_mb"]

          for path in ("/tmp/python-evidence.json", "/tmp/web-evidence.json"):
              evidence = json.load(open(path, encoding="utf-8"))
              assert evidence["measurement_class"] == "contract_baseline"
              assert evidence["qualified_for_routing"] is False
              assert evidence["raw_queries"] == "excluded"
              assert evidence["ranked_paths"] == "excluded"

          drift = json.load(open("/tmp/retrieval-drift-10k.json", encoding="utf-8"))
          baseline = drift["baseline_similarity_only"]
          provenance = drift["provenance_graph_rerank"]
          assert drift["corpus"]["items"] == 10240
          assert baseline["false_current_rate"] >= 0.90
          assert provenance["current_top1_rate"] == 1.0
          assert provenance["stale_top1_rate"] == 0.0
          assert provenance["near_miss_top1_rate"] == 0.0
          assert provenance["conflict_detection_recall"] == 1.0
          assert provenance["lineage_coverage"] == 1.0
          PY
