[project]
name = "knowledge-vault-memory-engine"
version = "0.1.0"
description = "Dependency-free markdown memory engine for KnowledgeVault, agents, humans, and Obsidian."
readme = "MEMORY_ENGINE.md"
requires-python = ">=3.11"

[project.scripts]
kv-memory = "memory_engine.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
