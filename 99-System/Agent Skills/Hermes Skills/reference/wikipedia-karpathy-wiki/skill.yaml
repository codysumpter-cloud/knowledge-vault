skill_id: wikipedia_karpathy_wiki
name: Wikipedia Karpathy Wiki
version: 0.1.0
status: draft
owner: Prismtek / Buddy ecosystem
category:
  - reference
  - world-knowledge
  - learning
  - research
runtime: hermes-agent
mode: source_guided_reference
risk_posture: citation_required_for_factual_reuse

summary: >-
  A Knowledge Vault skill for turning English Wikipedia into compact,
  Karpathy-style concept cards, learning notes, reading paths, and source maps
  without storing a raw full-site mirror in Git.

sources:
  primary:
    - name: English Wikipedia
      url: https://en.wikipedia.org
      role: article source and concept graph
    - name: Wikimedia dumps
      url: https://dumps.wikimedia.org/enwiki/latest/
      role: offline batch source outside Git
    - name: MediaWiki API
      url: https://www.mediawiki.org/wiki/API:Main_page
      role: live page, revision, and metadata fetch
    - name: MediaWiki API etiquette
      url: https://www.mediawiki.org/wiki/API:Etiquette
      role: polite API usage rules
    - name: Wikimedia Foundation Terms of Use
      url: https://foundation.wikimedia.org/wiki/Policy:Terms_of_Use
      role: licensing and attribution posture

inputs:
  - user_question
  - topic_optional
  - wikipedia_url_optional
  - article_title_optional
  - desired_depth_optional
  - freshness_requirement_optional

outputs:
  - answer
  - concept_card_optional
  - dependency_graph_optional
  - reading_path_optional
  - uncertainty_notes
  - citations_when_source_used

capabilities:
  allow_public_reference_use: true
  allow_wikipedia_api_use: true
  allow_dump_ingestion_planning: true
  allow_karpathy_style_summary_generation: true
  allow_concept_graph_generation: true
  allow_reading_path_generation: true

limits:
  allow_verbatim_large_copying: false
  allow_raw_dump_commits: false
  allow_media_reuse_without_license_check: false
  allow_high_stakes_final_authority_from_wikipedia_only: false

safety:
  require_license_awareness: true
  require_attribution_for_reused_text: true
  require_source_url_for_generated_notes: true
  require_retrieval_date_for_generated_notes: true
  require_freshness_label: true
  require_current_verification_for_volatile_topics: true
  require_external_authority_for_high_stakes_topics: true

freshness_classes:
  stable:
    examples:
      - mathematics
      - basic physics
      - grammar
      - ancient history overview
    behavior: derived notes may be reused with source metadata
  medium:
    examples:
      - software history
      - company history
      - scientific consensus summaries
      - population statistics
    behavior: refresh before formal or public claims
  volatile:
    examples:
      - current events
      - active public roles
      - active regulations
      - living people
      - market data
    behavior: verify live before answering

files:
  readme: README.md
  skill_contract: WIKIPEDIA_KARPATHY_WIKI_SKILL.md
  sourcebook: WIKIPEDIA_KARPATHY_SOURCEBOOK.md
  ingestion_runbook: WIKIPEDIA_INGESTION_RUNBOOK.md
  schema: WIKIPEDIA_TOPIC_SCHEMA.json

response_contract:
  teach_topic:
    - Tiny model
    - Build from primitives
    - Mechanism
    - Why it matters
    - Common traps
    - Read next
    - Source posture
  generate_note:
    - source metadata
    - original summary
    - primitives
    - relationships
    - examples
    - confusions
    - freshness
    - quality gate

activation_examples:
  - Use Wikipedia Karpathy Wiki. Build a concept card for entropy.
  - Use Wikipedia Karpathy Wiki. Teach the Industrial Revolution with dependencies, mechanisms, and what to read next.
  - Use Wikipedia Karpathy Wiki. Given this Wikipedia URL, turn it into an agent-usable note with citations and freshness flags.
